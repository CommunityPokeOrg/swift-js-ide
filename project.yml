name: PokeIDE
options:
  bundleIdPrefix: org.communitypoke
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  EditorCore:
    path: Packages/EditorCore

targetTemplates:
  AppBase:
    type: application
    sources:
      - path: App
    dependencies:
      - package: EditorCore
        product: EditorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.communitypoke.PokeIDE
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PokeIDE

targets:
  PokeIDE-iOS:
    platform: iOS
    templates: [AppBase]
    scheme: {}
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  PokeIDE-macOS:
    platform: macOS
    templates: [AppBase]
    scheme: {}
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: App/Resources/PokeIDE.entitlements

schemes:
  PokeIDE-iOS:
    build:
      targets:
        PokeIDE-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  PokeIDE-macOS:
    build:
      targets:
        PokeIDE-macOS: all
    run:
      config: Debug
    archive:
      config: Release
